<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诸侯争霸 · 架构图谱</title>
<style>
/* 架构图谱样式：深色、玻璃卡片、无外部资源（字体用系统字体） */
:root {
  --bg: #070b17;
  --bg2: #0c1224;
  --panel: rgba(255, 255, 255, 0.035);
  --panel2: rgba(255, 255, 255, 0.06);
  --line: rgba(255, 255, 255, 0.08);
  --line2: rgba(255, 255, 255, 0.14);
  --text: #e6e9f2;
  --muted: #8a93ab;
  --dim: #5d6680;
  --accent: #7c5cff;
  --accent2: #22d3ee;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.6 var(--sans); }
body {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(124, 92, 255, 0.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(34, 211, 238, 0.10), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
a { color: inherit; text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
::selection { background: rgba(124, 92, 255, 0.45); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

/* ------------------------------------------------------------ 布局 */
#app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
#nav {
  border-right: 1px solid var(--line); background: rgba(7, 11, 23, 0.72); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; padding: 20px 14px; overflow-y: auto;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 18px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 24px rgba(124, 92, 255, 0.45);
}
.brand-title { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
.brand-sub { font-size: 11px; color: var(--muted); }
.nav-group { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.5px; padding: 14px 10px 6px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--muted);
  cursor: pointer; transition: background .15s, color .15s; font-size: 13.5px;
}
.nav-link:hover { background: var(--panel2); color: var(--text); }
.nav-link.active { background: linear-gradient(90deg, rgba(124, 92, 255, 0.22), rgba(124, 92, 255, 0.04)); color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
.nav-link .ico { width: 20px; text-align: center; }
.nav-link .cnt { margin-left: auto; font-size: 11px; color: var(--dim); font-family: var(--mono); }
.nav-foot { margin-top: auto; padding: 16px 10px 0; font-size: 11px; color: var(--dim); line-height: 1.7; border-top: 1px solid var(--line); }

#main { overflow-y: auto; position: relative; }
#topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 32px;
  background: rgba(7, 11, 23, 0.7); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
}
.crumb { color: var(--muted); font-size: 13px; }
.crumb b { color: var(--text); font-weight: 600; }
.search-btn {
  margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 7px 12px; min-width: 260px;
  border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); color: var(--muted); cursor: pointer; font: inherit;
}
.search-btn:hover { border-color: rgba(124, 92, 255, 0.6); color: var(--text); }
.kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 6px; color: var(--dim); }
#view { padding: 28px 32px 80px; max-width: 1280px; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------ 通用 */
h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: 0.5px; }
h2 { font-size: 18px; margin: 34px 0 14px; display: flex; align-items: center; gap: 10px; }
h2 .sub { font-size: 12px; color: var(--muted); font-weight: 400; }
h3 { font-size: 14px; margin: 22px 0 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
.lead { color: var(--muted); margin: 0 0 8px; max-width: 820px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  transition: border-color .15s, transform .15s, background .15s; position: relative;
}
.card.click { cursor: pointer; }
.card.click:hover { border-color: rgba(124, 92, 255, 0.55); background: var(--panel2); transform: translateY(-2px); }
.card-title { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card-text { color: var(--muted); font-size: 13px; margin-top: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.03); color: var(--text); margin: 2px 4px 2px 0; white-space: nowrap;
}
.chip.link { cursor: pointer; }
.chip.link:hover { border-color: var(--accent); background: rgba(124, 92, 255, 0.15); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip.mono { font-family: var(--mono); }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; letter-spacing: 0.3px; white-space: nowrap; }
.st-draft { background: rgba(148, 163, 184, 0.14); color: #b6c0d4; border: 1px solid rgba(148, 163, 184, 0.25); }
.st-wip { background: rgba(251, 191, 36, 0.14); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.3); }
.st-done { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
.st-open { background: rgba(124, 92, 255, 0.16); color: #c4b5fd; border: 1px solid rgba(124, 92, 255, 0.35); }
.st-decided { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text);
  padding: 5px 11px; border-radius: 9px; font: inherit; font-size: 12.5px; cursor: pointer; transition: all .15s;
}
.btn:hover { border-color: var(--accent); background: rgba(124, 92, 255, 0.18); }
.btn.primary { background: linear-gradient(135deg, var(--accent), #5b8cff); border-color: transparent; }
.btn.sm { padding: 2px 8px; font-size: 11.5px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11.5px; letter-spacing: 0.8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: none; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: rgba(255, 255, 255, 0.025); }
pre.code {
  background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto;
  font: 12.5px/1.65 var(--mono); color: #cbd5e1; margin: 0;
}
.k { color: #c4b5fd; } .s { color: #86efac; } .n { color: #fcd34d; } .c { color: #64748b; } .f { color: #67e8f9; }
.cmdline {
  font-family: var(--mono); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
}
.cmdline .v { color: #fcd34d; font-weight: 700; }
.cmdline .sel { color: #67e8f9; }

/* ------------------------------------------------------------ 总览 */
.hero {
  position: relative; overflow: hidden; border-radius: 20px; padding: 34px 34px 30px; border: 1px solid var(--line2);
  background:
    radial-gradient(600px 260px at 100% 0%, rgba(124, 92, 255, 0.35), transparent 70%),
    radial-gradient(500px 240px at 0% 100%, rgba(34, 211, 238, 0.18), transparent 70%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
}
.hero h1 { font-size: 34px; background: linear-gradient(90deg, #fff, #c4b5fd 60%, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { font-size: 15px; }
.hero-units { position: absolute; right: 26px; top: 22px; width: 300px; height: 150px; opacity: 0.9; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 24px; }
.stat { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: all .15s; }
.stat:hover { border-color: var(--accent); transform: translateY(-2px); }
.stat b { display: block; font-size: 26px; font-family: var(--mono); background: linear-gradient(90deg, #fff, #a5b4fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: 12px; color: var(--muted); }
.pr-ico { font-size: 22px; }

/* ------------------------------------------------------------ 分层 */
.stack { display: grid; grid-template-columns: 1fr 210px; gap: 14px; }
.stack-main { display: flex; flex-direction: column; gap: 8px; }
.layer {
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; cursor: pointer; position: relative; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lc) 16%, transparent), rgba(255, 255, 255, 0.015) 70%);
  transition: all .18s;
}
.layer::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--lc); }
.layer:hover, .layer.hl { border-color: var(--lc); transform: translateX(3px); box-shadow: 0 0 0 1px var(--lc), 0 8px 30px color-mix(in srgb, var(--lc) 25%, transparent); }
.layer.dimmed { opacity: 0.35; }
.layer-head { display: flex; align-items: baseline; gap: 10px; }
.layer-name { font-weight: 700; font-size: 15px; }
.layer-en { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.layer-role { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.layer.band { padding: 6px 18px; border-style: dashed; text-align: center; }
.layer.band .layer-role { display: none; }
.layer .mods { margin-top: 8px; }
.stack-side { display: flex; flex-direction: column; gap: 8px; }
.rule { border: 1px dashed var(--line2); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 12.5px; }

/* ------------------------------------------------------------ 模块图 */
.graph-wrap { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--line); border-radius: 16px; padding: 10px; overflow-x: auto; }
svg.graph { display: block; }
svg.graph .edge { fill: none; stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.6; transition: stroke .15s, opacity .15s; }
svg.graph .edge.hl { stroke: #a78bfa; stroke-width: 2.4; }
svg.graph .edge.dim { opacity: 0.12; }
svg.graph .node { cursor: pointer; }
svg.graph .node rect { fill: rgba(15, 22, 42, 0.95); stroke: rgba(255, 255, 255, 0.14); transition: all .15s; }
svg.graph .node:hover rect, svg.graph .node.hl rect { stroke: #a78bfa; fill: rgba(40, 30, 80, 0.95); }
svg.graph .node.dim { opacity: 0.3; }
svg.graph text { fill: var(--text); font: 13px var(--sans); }
svg.graph text.sm { fill: var(--muted); font-size: 11px; }
.contrib { display: flex; flex-wrap: wrap; gap: 4px; }

/* ------------------------------------------------------------ NPC / 职业 */
.prof-card { overflow: hidden; }
.prof-card::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 140px; height: 140px; border-radius: 50%; background: var(--pc); opacity: 0.08; filter: blur(4px); }
.avatar {
  width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #0b1020;
  background: linear-gradient(135deg, var(--pc), color-mix(in srgb, var(--pc) 55%, #fff)); box-shadow: 0 6px 22px color-mix(in srgb, var(--pc) 40%, transparent); flex: none;
}
.avatar.lg { width: 64px; height: 64px; font-size: 30px; border-radius: 18px; }
.bars { display: grid; grid-template-columns: 40px 1fr 34px; gap: 5px 8px; align-items: center; font-size: 11.5px; margin-top: 12px; }
.bar { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--pc, var(--accent)), color-mix(in srgb, var(--pc, var(--accent)) 50%, #fff)); }
.bars .v { text-align: right; font-family: var(--mono); color: var(--muted); }
.comp-card .fields { margin-top: 8px; font-size: 12px; }
.comp-card .fields div { display: grid; grid-template-columns: 74px 64px 1fr; gap: 6px; padding: 3px 0; border-top: 1px dashed var(--line); }
.comp-card .fields code { color: #c4b5fd; }
.comp-card .fields .ty { color: var(--dim); font-family: var(--mono); font-size: 11px; }

/* 命令 → 行为 → 动作 流程 */
.flow { display: grid; grid-template-columns: 1fr 34px 1fr 34px 1.3fr 34px 1fr; align-items: stretch; gap: 0; }
.flow .step { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.flow .step h4 { margin: 0 0 4px; font-size: 13px; }
.flow .step .muted { font-size: 12px; }
.flow .arrow { display: grid; place-items: center; color: var(--dim); font-size: 18px; }
.loop { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.loop span { padding: 4px 10px; border-radius: 8px; font-size: 12px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.03); transition: all .25s; }
.loop span.on { background: color-mix(in srgb, var(--pc, var(--accent)) 30%, transparent); border-color: var(--pc, var(--accent)); color: #fff; box-shadow: 0 0 18px color-mix(in srgb, var(--pc, var(--accent)) 40%, transparent); }

/* 矩阵 */
.matrix { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.matrix table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.matrix th, .matrix td { padding: 9px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; white-space: nowrap; }
.matrix th { color: var(--muted); font-weight: 600; background: rgba(0, 0, 0, 0.2); cursor: pointer; }
.matrix th:hover { color: #fff; }
.matrix td.yes { background: color-mix(in srgb, var(--pc) 13%, transparent); }
.matrix td.yes span { cursor: pointer; }
.matrix td.no { color: var(--dim); }
.matrix td.rowh { text-align: left; cursor: pointer; }
.matrix tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

/* ------------------------------------------------------------ 命令 */
.playground { border: 1px solid rgba(124, 92, 255, 0.35); border-radius: 18px; padding: 18px; background: linear-gradient(180deg, rgba(124, 92, 255, 0.10), rgba(124, 92, 255, 0.02)); }
.pg-input { display: flex; gap: 10px; align-items: center; }
.pg-input input {
  flex: 1; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line2); border-radius: 12px; color: #fff; padding: 12px 14px;
  font: 16px var(--mono); outline: none; transition: border-color .15s, box-shadow .15s;
}
.pg-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: none; color: var(--muted); padding: 8px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
.seg button.on { background: rgba(124, 92, 255, 0.3); color: #fff; }
.pg-sig { margin-top: 10px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); min-height: 20px; }
.pg-out { margin-top: 12px; display: grid; gap: 8px; }
.pg-ok, .pg-err { border-radius: 12px; padding: 12px 14px; font-size: 13px; }
.pg-ok { border: 1px solid rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.07); }
.pg-err { border: 1px solid rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08); }
.pg-arg { display: grid; grid-template-columns: 90px 90px 1fr; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.pg-arg:first-of-type { border-top: none; }
.pg-arg .ty { color: var(--dim); font-size: 12px; }
.pg-ex { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.cmd-row td:first-child { width: 84px; }
.verb { font-weight: 800; font-size: 17px; color: #fcd34d; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 12px; }
.filters input { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line2); border-radius: 9px; color: var(--text); padding: 6px 10px; font: inherit; outline: none; min-width: 220px; }
.filters input:focus { border-color: var(--accent); }

/* 节拍 */
.pipe { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.pipe .ph { flex: 1 1 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; position: relative; }
.pipe .ph b { font-family: var(--mono); font-size: 12.5px; color: #a5b4fc; }
.pipe .ph .muted { font-size: 12px; }
.pipe .ph .no { position: absolute; right: 10px; top: 8px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.pipe .ph.pulse { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px rgba(124, 92, 255, 0.35); }

/* 路线图 */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--accent2), transparent); }
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--dim); }
.tl-item.wip::before { border-color: var(--warn); background: var(--warn); box-shadow: 0 0 14px var(--warn); }
.tl-item.done::before { border-color: var(--ok); background: var(--ok); }

/* ------------------------------------------------------------ 抽屉 */
#scrim { position: fixed; inset: 0; background: rgba(2, 4, 10, 0.55); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#scrim.on { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 94vw); z-index: 21; transform: translateX(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  background: linear-gradient(180deg, #0e1530, #0a0f22); border-left: 1px solid var(--line2); box-shadow: -30px 0 80px rgba(0, 0, 0, 0.5); overflow-y: auto;
}
#drawer.on { transform: none; }
.dr-head { position: sticky; top: 0; z-index: 2; padding: 20px 24px 16px; background: rgba(14, 21, 48, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.dr-close { position: absolute; right: 16px; top: 16px; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 16px; }
.dr-close:hover { color: #fff; border-color: var(--accent); }
.dr-kind { font-size: 11px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }
.dr-title { font-size: 22px; font-weight: 750; margin: 2px 0 4px; display: flex; gap: 10px; align-items: center; }
.dr-body { padding: 4px 24px 40px; }
.dr-body h3 { margin-top: 24px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
.kv .k2 { color: var(--dim); }
.ex-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.ex-row:first-child { border-top: none; }
.ex-row .why { font-size: 11.5px; color: var(--dim); margin-left: auto; }

/* ------------------------------------------------------------ 搜索面板 */
#palette { position: fixed; inset: 0; z-index: 30; display: none; place-items: start center; padding-top: 12vh; background: rgba(2, 4, 10, 0.6); backdrop-filter: blur(4px); }
#palette.on { display: grid; }
.pal { width: min(640px, 92vw); background: #0e1530; border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6); overflow: hidden; }
.pal input { width: 100%; border: none; outline: none; background: transparent; color: #fff; font: 17px var(--sans); padding: 16px 18px; border-bottom: 1px solid var(--line); }
.pal-list { max-height: 56vh; overflow-y: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.pal-item.on, .pal-item:hover { background: rgba(124, 92, 255, 0.2); }
.pal-item .kind { font-size: 11px; color: var(--dim); width: 52px; flex: none; }
.pal-item .desc { color: var(--muted); font-size: 12px; margin-left: auto; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; background: #1b2347; border: 1px solid var(--line2); padding: 8px 16px; border-radius: 10px; font-size: 13px; transition: all .2s; z-index: 40; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  #nav { display: none; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .stack { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr; }
  .flow .arrow { transform: rotate(90deg); height: 26px; }
  .hero-units { display: none; }
  #view { padding: 20px 16px 60px; }
}

/* 代码进度条 */
.prog { display: grid; grid-template-columns: 44px 1fr 52px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; color: var(--muted); }
.prog:hover { color: #fff; }
.prog-bar { height: 8px; background: rgba(255, 255, 255, 0.07); border-radius: 99px; overflow: hidden; }
.prog-bar i { display: block; height: 100%; background: linear-gradient(90deg, #34d399, #a5b4fc); border-radius: 99px; }
.prog b { text-align: right; color: #e2e8f0; font-size: 12px; }

</style>

<script>
// 命令与选择器解析（浏览器和 Node 共用；不依赖任何库）。
//
// 这是第 0 阶段之前的**规格原型**：语法和将来 src/engine/commands/ 的解析器保持一致，
// 图谱页面的"命令试验台"和 tools/check-atlas.mjs 都用它。
(function () {
  'use strict';

  function index(atlas) {
    const profs = new Map();
    for (const p of atlas.professions) {
      profs.set(p.id, p); profs.set(p.name, p); profs.set(p.short, p);
    }
    const tags = new Set(atlas.professions.flatMap((p) => p.tags));
    const cmds = new Map();
    for (const c of atlas.commands) { cmds.set(c.verb, c); cmds.set(c.id, c); }
    return { profs, tags, cmds, w: atlas.sampleWorld };
  }

  const ok = (value, show) => ({ ok: true, value, show });
  const bad = (error, hint) => ({ ok: false, error, hint });

  // ---------------------------------------------------------------- 选择器
  // 一段：头部（@职业|@标签|*|#队伍|人名）+ 可选 @地点 + 可选 :数量 / :百分比，用逗号多选
  function parseSelector(text, ix) {
    if (!text) return bad('缺少选择器', '例：@木:5、#一队、阿三');
    const parts = [];
    for (const raw of text.split(',')) {
      const seg = raw.trim();
      if (!seg) return bad('选择器里有空段', '多选用逗号隔开：@木,@石');
      let i = 0; const part = { raw: seg };
      const readName = () => { let s = ''; while (i < seg.length && seg[i] !== '@' && seg[i] !== ':') s += seg[i++]; return s; };
      if (seg[0] === '@') {
        i = 1; const n = readName();
        const p = ix.profs.get(n);
        if (p) { part.kind = 'prof'; part.prof = p.id; part.label = p.name; }
        else if (ix.tags.has(n)) { part.kind = 'tag'; part.tag = n; part.label = '标签 ' + n; }
        else return bad(`没有叫"${n}"的职业或标签`, '职业简称：' + [...new Set([...ix.profs.values()].map((x) => x.short))].join(' '));
      } else if (seg[0] === '*') {
        i = 1; part.kind = 'all'; part.label = '所有人';
      } else if (seg[0] === '#') {
        i = 1; const n = readName();
        if (!n) return bad('# 后面要写队名');
        part.kind = 'group'; part.group = n; part.label = '队伍 ' + n;
        if (!ix.w.groups.includes(n)) part.warn = `示例世界里还没有队伍"${n}"（真实游戏里要先"编"）`;
      } else {
        const n = readName();
        if (!ix.w.people.includes(n) && !ix.w.notables.includes(n)) return bad(`不认识"${n}"`, '选职业要加 @，选队伍要加 #；人名示例：' + ix.w.people.join('、'));
        part.kind = 'person'; part.person = n; part.label = n;
      }
      while (i < seg.length) {
        if (seg[i] === '@') {
          i++; const pl = readName();
          if (!ix.w.places.includes(pl)) return bad(`没有地点"${pl}"`, '示例地点：' + ix.w.places.join('、'));
          if (part.place) return bad('一段选择器只能限定一个地点');
          part.place = pl;
        } else if (seg[i] === ':') {
          i++; let num = ''; while (i < seg.length && /[0-9]/.test(seg[i])) num += seg[i++];
          let pct = false; if (seg[i] === '%') { pct = true; i++; }
          const n = parseInt(num, 10);
          if (!num || n <= 0) return bad('冒号后面要写正整数', '例：@木:5 或 @农:30%');
          if (pct && n > 100) return bad('百分比不能超过 100');
          if (part.kind === 'person') return bad('指定某个人时不能再写数量');
          if (pct) part.percent = n; else part.count = n;
        } else return bad(`选择器"${seg}"写法不对`);
      }
      parts.push(part);
    }
    const show = parts.map((p) => {
      let s = p.label;
      if (p.place) s = p.place + '的' + s;
      if (p.count) s += ` ×${p.count}`;
      if (p.percent) s += ` ${p.percent}%`;
      return s;
    }).join(' + ');
    return ok(parts, show);
  }

  // ---------------------------------------------------------------- 参数类型
  const TYPES = {
    sel: { name: '选择器', parse: (t, ix) => parseSelector(t, ix) },
    town: { name: '己方城镇', parse: (t, ix) => (ix.w.myTowns.includes(t) ? ok(t) : bad(`"${t}"不是你的城镇`, '你的城镇：' + ix.w.myTowns.join('、'))) },
    place: { name: '地点', parse: (t, ix) => (ix.w.places.includes(t) ? ok(t) : bad(`没有地点"${t}"`, '示例地点：' + ix.w.places.join('、'))) },
    target: { name: '目标', parse: (t, ix) => {
      if (t.includes('.')) {
        const [f, town] = t.split('.');
        if (!ix.w.factions.includes(f)) return bad(`没有势力"${f}"`);
        if (!(ix.w.towns[f] || []).includes(town)) return bad(`${f}没有城镇"${town}"`, `${f}的城镇：` + (ix.w.towns[f] || []).join('、'));
        return ok({ faction: f, town }, `${f} 的 ${town}`);
      }
      return ix.w.places.includes(t) ? ok({ place: t }, t) : bad(`没有目标"${t}"`, '写成 势力.城镇 或地点名');
    } },
    work: { name: '活', parse: (t, ix) => (ix.w.works[t] ? ok(t, `${t}（${ix.profs.get(ix.w.works[t]).name}的活）`) : bad(`没有"${t}"这种活`, '可选：' + Object.keys(ix.w.works).join('、'))) },
    prof: { name: '职业', parse: (t, ix) => { const p = ix.profs.get(t); return p ? ok(p.id, p.name) : bad(`没有职业"${t}"`); } },
    item: { name: '物品', parse: (t, ix) => (ix.w.items.includes(t) ? ok(t) : bad(`没有物品"${t}"`, '可选：' + ix.w.items.join('、'))) },
    building: { name: '建筑', parse: (t, ix) => (ix.w.buildings.includes(t) ? ok(t) : bad(`没有建筑"${t}"`, '可选：' + ix.w.buildings.join('、'))) },
    group: { name: '队名', parse: (t) => { const n = t.replace(/^#/, ''); return n ? ok(n, '#' + n) : bad('缺少队名'); } },
    anyFaction: { name: '任意势力', parse: (t, ix) => (ix.w.factions.includes(t) ? ok(t) : bad(`没有势力"${t}"`, '示例势力：' + ix.w.factions.join('、'))) },
    faction: { name: '势力', parse: (t, ix) => (t === ix.w.me ? bad('不能对自己') : ix.w.factions.includes(t) ? ok(t) : bad(`没有势力"${t}"`, '示例势力：' + ix.w.factions.filter((f) => f !== ix.w.me).join('、'))) },
    notable: { name: '名人', parse: (t, ix) => (ix.w.notables.includes(t) ? ok(t) : bad(`不认识名人"${t}"`, '示例：' + ix.w.notables.join('、'))) },
    int: { name: '整数', parse: (t) => (/^\d+$/.test(t) ? ok(parseInt(t, 10)) : bad(`"${t}"不是整数`)) },
    amount: { name: '数量', parse: (t, ix) => {
      const items = [...ix.w.items].sort((a, b) => b.length - a.length);
      for (const it of items) {
        let m = t.match(new RegExp('^' + it + '(\\d+)$')); if (m) return ok({ item: it, n: +m[1] }, `${it} ${m[1]}`);
        m = t.match(new RegExp('^(\\d+)' + it + '$')); if (m) return ok({ item: it, n: +m[1] }, `${it} ${m[1]}`);
      }
      return bad(`"${t}"不是数量写法`, '例：粮200 或 300金');
    } },
    duration: { name: '时长', parse: (t) => { const m = t.match(/^(\d+)(天|日|季|年)$/); return m ? ok({ n: +m[1], unit: m[2] }, t) : bad(`"${t}"不是时长`, '例：30天、2季'); } },
    treaty: { name: '条约', parse: (t, ix) => (ix.w.treaties.includes(t) ? ok(t) : bad(`没有条约"${t}"`, '可选：' + ix.w.treaties.join('、'))) },
    disaster: { name: '天灾', parse: (t, ix) => (ix.w.disasters.includes(t) ? ok(t) : bad(`没有天灾"${t}"`, '可选：' + ix.w.disasters.join('、'))) },
    quota: { name: '职业比例', rest: true, parse: (toks, ix) => {
      if (!toks.length) return bad('缺少比例', '例：农50 木20 兵30');
      const out = []; let sum = 0;
      for (const t of toks) {
        const m = t.match(/^(\D+?)(\d+)%?$/);
        const p = m && ix.profs.get(m[1]);
        if (!p) return bad(`"${t}"不是"职业+数字"`, '例：农50');
        out.push({ prof: p.id, pct: +m[2] }); sum += +m[2];
      }
      if (sum > 100) return bad(`比例加起来 ${sum}，超过 100`);
      return ok(out, out.map((o) => `${ix.profs.get(o.prof).name} ${o.pct}%`).join('，') + (sum < 100 ? `（余下 ${100 - sum}% 不指定）` : ''));
    } },
    text: { name: '文字', rest: true, parse: (toks) => (toks.length ? ok(toks.join(' ')) : bad('缺少内容')) },
  };

  // ---------------------------------------------------------------- 命令
  function parseCommand(line, atlas, opts) {
    const ix = opts && opts.ix ? opts.ix : index(atlas);
    const who = (opts && opts.who) || null;
    const toks = String(line || '').trim().split(/\s+/).filter(Boolean);
    if (!toks.length) return { ok: false, error: '空命令' };
    const verb = toks[0];
    const cmd = ix.cmds.get(verb);
    if (!cmd) {
      const near = atlas.commands.filter((c) => c.verb.includes(verb) || verb.includes(c.verb)).map((c) => c.verb);
      return { ok: false, error: `没有命令"${verb}"`, hint: near.length ? '是不是：' + near.join('、') : '命令列表见"命令"一页' };
    }
    if (who && !cmd.who.includes(who)) return { ok: false, cmd, error: `"${cmd.verb}"不是${who === 'god' ? '上帝' : '诸侯'}能用的命令` };
    const args = []; let k = 1;
    for (const [rawName, type] of cmd.args) {
      const optional = rawName.endsWith('?'); const name = rawName.replace('?', '');
      const T = TYPES[type];
      if (!T) return { ok: false, cmd, error: `内部错误：未知参数类型 ${type}` };
      if (T.rest) {
        const res = T.parse(toks.slice(k), ix); k = toks.length;
        if (!res.ok) return { ok: false, cmd, args, error: `${name}：${res.error}`, hint: res.hint };
        args.push({ name, type, typeName: T.name, raw: res.value, show: res.show || String(res.value) });
        continue;
      }
      if (k >= toks.length) {
        if (optional) { args.push({ name, type, typeName: T.name, skipped: true }); continue; }
        return { ok: false, cmd, args, error: `缺少参数：${name}（${T.name}）`, hint: '格式：' + signature(cmd) };
      }
      const res = T.parse(toks[k], ix);
      if (!res.ok) return { ok: false, cmd, args, error: `${name}：${res.error}`, hint: res.hint };
      args.push({ name, type, typeName: T.name, token: toks[k], raw: res.value, show: res.show || String(res.value) });
      k++;
    }
    if (k < toks.length) return { ok: false, cmd, args, error: `多了参数：${toks.slice(k).join(' ')}`, hint: '格式：' + signature(cmd) };
    const warns = args.flatMap((a) => (a.type === 'sel' && Array.isArray(a.raw) ? a.raw.filter((p) => p.warn).map((p) => p.warn) : []));
    return { ok: true, cmd, args, warns };
  }

  function signature(cmd) {
    return cmd.verb + ' ' + cmd.args.map(([n, t]) => {
      const opt = n.endsWith('?'); const name = n.replace('?', '');
      const s = (TYPES[t] && TYPES[t].rest) ? name + '…' : name;
      return opt ? `[${s}]` : `<${s}>`;
    }).join(' ');
  }

  // ---------------------------------------------------------------- 推导：职业 → 能接的命令
  function professionOrders(prof, atlas) {
    const bs = atlas.behaviors.filter((b) => prof.behaviors.includes(b.id));
    return atlas.orders.filter((o) => bs.some((b) => b.fits.includes(o.id)));
  }

  function professionCommands(prof, atlas) {
    const w = atlas.sampleWorld;
    const orderIds = new Set(professionOrders(prof, atlas).map((o) => o.id));
    const myWork = Object.keys(w.works).find((k) => w.works[k] === prof.id);
    const sel = `@${prof.short}:5`;
    const fill = { town: '青石城', place: '北林', target: '赤焰.落霞镇', item: '木头', prof: prof.id === 'soldier' ? '农' : '兵',
      group: prof.short + '队', faction: '白鹿', anyFaction: '白鹿', building: '兵营', int: '10', duration: '30天' };
    const out = [];
    for (const c of atlas.commands) {
      if (!c.who.includes('lord')) continue;
      const selArgs = c.args.filter(([, t]) => t === 'sel');
      if (c.id === 'quota') {
        const other = prof.short === '农' ? '木' : '农';
        out.push({ cmd: c, example: `比例 青石城 ${prof.short}30 ${other}50`, why: '职业比例里写上它' });
        continue;
      }
      if (!selArgs.length) continue;
      if (c.order && !orderIds.has(c.order)) continue;
      if (c.order === 'work' && !myWork) continue;
      const parts = [c.verb]; let firstSel = true;
      const places = c.id === 'build' ? ['青石城'] : ['北林', '青石城'];
      for (const [n, t] of c.args) {
        const optional = n.endsWith('?');
        if (t === 'sel') {
          if (firstSel) { parts.push(sel); firstSel = false; } else if (!optional) parts.push('#商队');
          else parts.push(sel);
        } else if (t === 'work') parts.push(myWork);
        else if (t === 'place') { if (!optional || c.id !== 'retreat') parts.push(places.shift() || '北林'); }
        else if (!optional) parts.push(fill[t] || '?');
      }
      out.push({ cmd: c, example: parts.join(' '), why: c.order ? `长期命令 ${c.order}` : '通用' });
    }
    return out;
  }

  globalThis.AtlasParser = { index, parseSelector, parseCommand, signature, professionOrders, professionCommands, TYPES };
})();

</script>

  function hl(code) {
    const re = /(\/\/.*$)|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b(?:export|default|const|function|return|interface|type|run)\b)/gm;
    let out = ''; let last = 0; let m;
    while ((m = re.exec(code))) {

      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : 'k';

  }
  function lit(v) {
    if (Array.isArray(v)) return '[' + v.map(lit).join(', ') + ']';
    if (v && typeof v === 'object') {
      const ks = Object.keys(v);
      return ks.length ? '{ ' + ks.map((k) => `${k}: ${lit(v[k])}`).join(', ') + ' }' : '{}';

  let toastTimer = 0;

    </div>`;
  }

  pages.layers = () => {
    const L = (id) => layer(id);
    const row = (l, extra) => `<div class="layer${l.side ? '' : ''}" data-layer="${l.id}" style="--lc:${l.color}" ${go('#/layers/' + l.id)}>

    A.modules.forEach((m) => d(m.id));
    const cols = []; A.modules.forEach((m) => (cols[depth[m.id]] = cols[depth[m.id]] || []).push(m));
    const W = 160, H = 56, GX = 46, GY = 18, PAD = 16;

    const svgW = PAD * 2 + cols.length * W + (cols.length - 1) * GX;

    const edges = A.modules.flatMap((m) => m.requires.map((r) => {
      const a = pos[r], b = pos[m.id]; const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2; const mx = (x1 + x2) / 2;

    if (tr) {
      ev.stopPropagation(); pg.text = tr.dataset.try;
      if (currentPage === 'commands' && !location.hash.split('/')[2]) { const inp = $('#pgInput'); inp.value = pg.text; renderPlayground($('#view')); inp.focus(); }
      else { currentPage = null; location.hash = '#/commands'; }
      return;
    }
    if (t.closest('[data-close]') || t.id === 'scrim') { closeDrawer(); return; }
    const pi = t.closest('.pal-item[data-i]'); if (pi) { pickPalette(+pi.dataset.i); return; }
    if (t.id === 'palette') { closePalette(); return; }
    const g = t.closest('[data-go]'); if (g) { ev.preventDefault(); location.hash = g.dataset.go; }
  });
  $('#searchBtn').addEventListener('click', openPalette);
  $('#palInput').addEventListener('input', () => { palSel = 0; renderPalette(); });
  document.addEventListener('keydown', (ev) => {
    const palOpen = $('#palette').classList.contains('on');
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); palOpen ? closePalette() : openPalette(); return; }
    if (palOpen) {
      if (ev.key === 'Escape') closePalette();
      else if (ev.key === 'ArrowDown') { ev.preventDefault(); palSel = Math.min(palSel + 1, palHits.length - 1); renderPalette(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPalette(); }
      else if (ev.key === 'Enter') pickPalette(palSel);
      return;
    }
    if (ev.key === 'Escape' && $('#drawer').classList.contains('on')) closeDrawer();
    if (ev.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); openPalette(); }
  });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
